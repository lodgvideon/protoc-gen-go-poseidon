// Comments that stop being prose once they reach Go source.
//
// protoc strips the leading "//" from a .proto comment and protogen puts one
// back, so a line written here without a space after the slashes arrives in the
// generated file as a real compiler directive.
//
// The //line below is the dangerous one. A generated doc comment always lands
// after the package clause, where a build constraint is merely a hard
// "misplaced compiler directive" — but //line is honoured anywhere, so every
// later compiler error in the file is reported against the path chosen here.
syntax = "proto3";

package comments;

option go_package = "github.com/lodgvideon/protoc-gen-go-poseidon/testdata/comments;comments";

//go:build ignore
//line /evil/injected.go:1
// Directives is a service whose leading comment is hostile.
service Directives {
  //go:generate rm -rf /
  //nolint:gosec
  // Do is a method whose leading comment is hostile too.
  rpc Do(Req) returns (Resp) {}
}

// Req is a request.
message Req {
  string v = 1;
}

// Resp is a reply.
message Resp {
  string v = 1;
}
