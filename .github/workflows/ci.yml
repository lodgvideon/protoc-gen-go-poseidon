name: ci
on:
  push:
    branches: [main]
  pull_request:

# Three modules live here and no `./...` reaches across them: the plugin binary
# at the root, the pgrpc runtime that generated code imports, and testdata,
# which exists only to COMPILE the generator's output — Go's toolchain skips any
# directory named testdata, so its files are unreachable from the root and a
# module rooted there is the way to build them at all. Every job is a matrix
# over all of them, or one rots unnoticed.
#
# test/e2e is separate from testdata on purpose: testdata proves the generated
# output compiles against pgrpc and protobuf and NOTHING ELSE, which a grpc-go
# dependency there would quietly destroy. In e2e grpc-go IS the point — it is
# the other implementation, and agreeing with it is the only evidence the wire
# behaviour is right.

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'pgrpc', 'testdata', 'test/e2e', 'examples/loadgen']
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install golangci-lint v2.5.0
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v2.5.0
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go vet ./...
      - run: golangci-lint run ./...

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'pgrpc', 'testdata', 'test/e2e', 'examples/loadgen']
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go build ./...
      - run: go test -race -count=1 ./...

  # pgrpc/go.mod pins a released poseidon, which is what a consumer of the
  # generated code actually gets. This job runs the same tests against
  # poseidon's main, so a breaking change to its grpc package surfaces here
  # rather than in a user's build after they upgrade.
  #
  # Only pgrpc: the root plugin module does not import poseidon at all, so
  # running this against it would test nothing.
  upstream-main:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pgrpc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: lodgvideon/poseidon-http-client
          ref: main
          path: .upstream
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: pgrpc/go.sum
      - name: Point pgrpc at poseidon main
        run: |
          go mod edit -replace=github.com/lodgvideon/poseidon-http-client=../.upstream
          go mod tidy
      - run: go build ./...
      - run: go test -race -count=1 ./...

  # The example is the only module shaped like a CONSUMER: it imports the
  # generated client and nothing else from this repo. Its dependency graph is
  # therefore the claim "a user links pgrpc, not the plugin, and never grpc-go"
  # — and a claim in a README is worth nothing without a check.
  consumer-deps:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/loadgen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: examples/loadgen/go.sum
      - name: A user's binary must not link the compiler or grpc-go
        run: |
          go list -deps ./... > deps.txt
          for p in google.golang.org/protobuf/compiler/protogen                    google.golang.org/protobuf/types/pluginpb                    google.golang.org/grpc; do
            if grep -qx "$p" deps.txt || grep -q "^$p/" deps.txt; then
              echo "::error::$p is linked into the example binary"
              exit 1
            fi
          done
          echo "clean: no compiler, no pluginpb, no grpc-go"
