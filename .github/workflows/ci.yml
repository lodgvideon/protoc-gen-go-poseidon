name: ci
on:
  push:
    branches: [main]
  pull_request:

# Three modules live here and no `./...` reaches across them: the plugin binary
# at the root, the pgrpc runtime that generated code imports, and testdata,
# which exists only to COMPILE the generator's output — Go's toolchain skips any
# directory named testdata, so its files are unreachable from the root and a
# module rooted there is the way to build them at all. Every job is a matrix
# over all three, or one of them rots unnoticed.

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'pgrpc', 'testdata']
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install golangci-lint v2.5.0
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v2.5.0
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go vet ./...
      - run: golangci-lint run ./...

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'pgrpc', 'testdata']
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go build ./...
      - run: go test -race -count=1 ./...

  # pgrpc/go.mod pins a released poseidon, which is what a consumer of the
  # generated code actually gets. This job runs the same tests against
  # poseidon's main, so a breaking change to its grpc package surfaces here
  # rather than in a user's build after they upgrade.
  #
  # Only pgrpc: the root plugin module does not import poseidon at all, so
  # running this against it would test nothing.
  upstream-main:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pgrpc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: lodgvideon/poseidon-http-client
          ref: main
          path: .upstream
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: pgrpc/go.sum
      - name: Point pgrpc at poseidon main
        run: |
          go mod edit -replace=github.com/lodgvideon/poseidon-http-client=../.upstream
          go mod tidy
      - run: go build ./...
      - run: go test -race -count=1 ./...
