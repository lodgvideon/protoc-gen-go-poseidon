name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Install golangci-lint v2.5.0
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v2.5.0
      - run: go vet ./...
      - run: golangci-lint run ./...

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - run: go build ./...
      - run: go test -race -count=1 ./...

  # go.mod pins a released poseidon, which is what a consumer of this plugin
  # actually gets. This job runs the same tests against poseidon's main, so a
  # breaking change to its grpc package surfaces here rather than in a user's
  # build after they upgrade. Mirrors the contrib/prometheus job in the
  # poseidon repo.
  upstream-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: lodgvideon/poseidon-http-client
          ref: main
          path: .upstream
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Point at poseidon main
        run: |
          go mod edit -replace=github.com/lodgvideon/poseidon-http-client=./.upstream
          go mod tidy
      - run: go build ./...
      - run: go test -race -count=1 ./...
